<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>molive</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<header>
  <h1>mo<span>live</span></h1>
  <div class="layouts" id="layouts">
    <button data-layout="solo">1</button>
    <button data-layout="split-h">左右</button>
    <button data-layout="split-v">上下</button>
    <button data-layout="grid-4">4</button>
  </div>
</header>

<main class="grid" id="grid">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>動画を挿入</h2>
    <input type="text" id="urlInput"
      placeholder="YouTube / Twitch / ニコニコのURL"
      autocomplete="off" spellcheck="false">
    <textarea id="embedInput" rows="3"
      placeholder="ニコニコの埋め込みタグ（&lt;iframe ...&gt;）を貼り付け"></textarea>
    <div class="hint" id="hint"></div>
    <div class="actions">
      <button id="cancelBtn">キャンセル</button>
      <button id="okBtn" class="primary" disabled>挿入</button>
    </div>
  </div>
</div>

<script src="js/platforms.js"></script>
<script src="js/nico.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
