<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>molive</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root {
  --bg: #0d0d10; --panel: #18181d; --border: #2a2a33;
  --accent: #ff3d6e; --text: #f0f0f5; --muted: #7a7a88;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
}
body { display: grid; grid-template-rows: auto 1fr; height: 100dvh; overflow: hidden; }

header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
}
header h1 { margin: 0; font-size: 15px; letter-spacing: .08em; }
header h1 span { color: var(--accent); }
header .tip { font-size: 11px; color: var(--muted); }

.grid {
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  gap: 6px; padding: 6px; min-height: 0;
}
.cell {
  position: relative; background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color .15s;
}
.cell:hover { border-color: var(--accent); }
.cell.filled { cursor: default; border-color: transparent; }
.cell.filled:hover { border-color: transparent; }
.cell iframe, .cell video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }

.placeholder {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  color: var(--muted); pointer-events: none;
}
.placeholder .plus {
  width: 46px; height: 46px; border-radius: 50%; background: #22222a;
  border: 1px solid var(--border); display: flex; align-items: center;
  justify-content: center; font-size: 24px; color: var(--text);
}
.placeholder .label { font-size: 12px; }

.clear-btn {
  position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
  border-radius: 50%; background: rgba(0,0,0,.65); color: #fff;
  border: 1px solid rgba(255,255,255,.2); font-size: 15px; cursor: pointer;
  display: none; align-items: center; justify-content: center; z-index: 2;
  padding: 0; line-height: 1;
}
.cell.filled:hover .clear-btn { display: flex; }
@media (hover: none) { .cell.filled .clear-btn { display: flex; opacity: .55; } }

.notice {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; padding: 16px;
  text-align: center; color: var(--muted); font-size: 12px;
}
.notice a {
  color: var(--accent); text-decoration: none; border: 1px solid var(--accent);
  padding: 6px 14px; border-radius: 8px; font-size: 12px;
}

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.7);
  backdrop-filter: blur(3px); display: flex; align-items: center;
  justify-content: center; z-index: 100; opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.overlay.open { opacity: 1; pointer-events: auto; }
.modal {
  width: min(460px, calc(100% - 24px)); background: var(--panel);
  border: 1px solid var(--border); border-radius: 14px; padding: 20px;
  transform: translateY(12px) scale(.98); transition: transform .2s;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.overlay.open .modal { transform: none; }
.modal h2 { margin: 0 0 14px; font-size: 15px; }
.modal input, .modal textarea {
  width: 100%; padding: 11px 13px; font-size: 14px; border-radius: 9px;
  border: 1px solid var(--border); background: #0f0f13; color: var(--text);
  outline: none; font-family: inherit;
}
.modal textarea { margin-top: 8px; font-size: 12px; font-family: monospace; resize: vertical; }
.modal input:focus, .modal textarea:focus { border-color: var(--accent); }
.hint { font-size: 12px; min-height: 18px; margin: 8px 2px 4px; color: var(--muted); }
.hint.ok { color: #4ade80; }
.hint.err { color: #ff5577; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
button {
  font-family: inherit; font-size: 13px; padding: 9px 18px;
  border-radius: 8px; cursor: pointer; border: 1px solid var(--border);
  background: #22222a; color: var(--text);
}
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary:not(:disabled):hover { filter: brightness(1.1); }

@media (max-width: 640px) {
  .grid { gap: 4px; padding: 4px; }
  header .tip { display: none; }
}
</style>
</head>
<body>

<header>
  <h1>mo<span>live</span></h1>
  <div class="tip">セルをタップで挿入 / × で解除</div>
</header>

<main class="grid">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>動画を挿入</h2>
    <input type="text" id="urlInput"
      placeholder="YouTube / Twitch / ニコニコのURL"
      autocomplete="off" spellcheck="false">
    <textarea id="embedInput" rows="3"
      placeholder="ニコニコの埋め込みタグ（&lt;iframe ...&gt;）を貼り付け"></textarea>
    <div class="hint" id="hint"></div>
    <div class="actions">
      <button id="cancelBtn">キャンセル</button>
      <button id="okBtn" class="primary" disabled>挿入</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const cells     = Array.from(document.querySelectorAll(".cell"));
  const overlay   = document.getElementById("overlay");
  const urlInput  = document.getElementById("urlInput");
  const embedInput= document.getElementById("embedInput");
  const hint      = document.getElementById("hint");
  const okBtn     = document.getElementById("okBtn");
  const cancelBtn = document.getElementById("cancelBtn");

  const STORAGE_KEY = "molive-v1";
  const parentHost  = location.hostname || "localhost";

  let activeIndex = null;
  let pending     = null;
  let state       = [null, null, null, null];

  // ---------- 保存・復元 ----------
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function restore() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (Array.isArray(s) && s.length === 4) state = s;
    } catch (e) {}
  }

  // ---------- URL解析 ----------
  function parse(raw) {
    const s = (raw || "").trim();
    if (!s) return { error: "" };

    let url;
    try {
      const norm = /^[a-z]+:\/\//i.test(s) ? s : "https://" + s;
      url = new URL(norm);
    } catch (e) {
      return { error: "URLの形式が正しくありません" };
    }

    const host = url.hostname.replace(/^www\./, "").toLowerCase();
    const path = url.pathname;

    // ---- YouTube ----
    if (host === "youtube.com" || host === "m.youtube.com" || host === "youtu.be") {
      // チャンネル固定URL（HLS再生用）: /channel/UC...
      const ch = path.match(/^\/channel\/(UC[\w-]+)/);
      if (ch) {
        return { platform: "YouTube (チャンネル)", channelId: ch[1], embed: null };
      }
      // 動画URL
      let id = null;
      if (host === "youtu.be") {
        id = path.split("/").filter(Boolean)[0];
      } else if (path === "/watch") {
        id = url.searchParams.get("v");
      } else if (/^\/(live|embed|shorts)\//.test(path)) {
        id = path.split("/").filter(Boolean)[1];
      }
      if (!id) {
        return { error: "YouTube: 動画IDを特定できません（チャンネルは /channel/UC... 形式で貼ってください）" };
      }
      return {
        platform: "YouTube (動画)",
        embed: "https://www.youtube.com/embed/" + id + "?autoplay=1&mute=1&playsinline=1"
      };
    }

    // ---- Twitch ----
    if (host === "twitch.tv" || host === "m.twitch.tv" || host === "player.twitch.tv") {
      const seg = path.split("/").filter(Boolean);
      if (seg[0] === "videos" && seg[1]) {
        return {
          platform: "Twitch (VOD)",
          embed: "https://player.twitch.tv/?video=" + seg[1] +
                 "&parent=" + parentHost + "&autoplay=true&muted=true"
        };
      }
      if (seg[0]) {
        return {
          platform: "Twitch",
          embed: "https://player.twitch.tv/?channel=" + seg[0] +
                 "&parent=" + parentHost + "&autoplay=true&muted=true"
        };
      }
      return { error: "Twitch: チャンネル名を特定できません" };
    }

    // ---- ニコニコ ----
    if (host === "nicovideo.jp" || host === "live.nicovideo.jp" || host === "sp.nicovideo.jp") {
      const seg = path.split("/").filter(Boolean);
      if (seg[0] === "watch" && seg[1]) {
        return { platform: "ニコニコ動画", embed: "https://embed.nicovideo.jp/watch/" + seg[1] + "?autoplay=1" };
      }
      if (seg[0] === "live" && seg[1]) {
        return { platform: "ニコニコ生放送", nicoLiveId: seg[1], embed: null };
      }
      if (seg.length === 1 && /^lv\d+$/.test(seg[0])) {
        return { platform: "ニコニコ生放送", nicoLiveId: seg[0], embed: null };
      }
      return { error: "ニコニコ: 動画ID/放送IDを特定できません" };
    }

    return { error: "対応URLではありません（YouTube / Twitch / ニコニコ）" };
  }

  // ---------- 描画 ----------
  function renderEmpty(cell, i) {
    cell.classList.remove("filled");
    cell.innerHTML =
      '<div class="placeholder">' +
        '<div class="plus">+</div>' +
        '<div class="label">タップで挿入</div>' +
      '</div>';
    cell.onclick = () => openModal(i);
  }

  function bindClear(cell, i) {
    const btn = cell.querySelector(".clear-btn");
    if (btn) btn.onclick = (e) => {
      e.stopPropagation();
      state[i] = null;
      persist();
      renderEmpty(cell, i);
    };
  }

  function renderFilled(cell, i) {
    const data = state[i];
    cell.classList.add("filled");
    cell.onclick = null;

    // カスタム埋め込みタグ（ニコニコの共有タグなど）
    if (data.rawEmbed) {
      cell.innerHTML = data.rawEmbed + '<button class="clear-btn" title="解除">×</button>';
      bindClear(cell, i);
      return;
    }

    // YouTube チャンネル固定（HLS）
    if (data.platform === "YouTube (チャンネル)" && data.channelId) {
      cell.innerHTML =
        '<video class="yt-video" controls autoplay muted playsinline></video>' +
        '<button class="clear-btn" title="解除">×</button>';
      const video = cell.querySelector(".yt-video");
      const hlsUrl = "https://ythls.kekikakademi.org/youtube/channel/" + data.channelId + ".m3u8";

      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(hlsUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (e, d) => {
          if (d.fatal) {
            cell.innerHTML =
              '<div class="notice"><div>現在配信していません</div></div>' +
              '<button class="clear-btn" title="解除">×</button>';
            bindClear(cell, i);
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = hlsUrl;
        video.addEventListener("loadedmetadata", () => video.play().catch(() => {}));
      } else {
        cell.innerHTML =
          '<div class="notice"><div>このブラウザはHLS再生に対応していません</div></div>' +
          '<button class="clear-btn" title="解除">×</button>';
      }
      bindClear(cell, i);
      return;
    }

    // ニコニコ生放送（埋め込み未許可）
    if (data.platform === "ニコニコ生放送") {
      const liveId = data.nicoLiveId;
      cell.innerHTML =
        '<div class="notice">' +
          '<div>この放送は埋め込みタグが必要です</div>' +
          '<div>放送ページの「共有」→埋め込みタグを上の欄に貼ってください</div>' +
          '<a href="https://live.nicovideo.jp/watch/' + liveId + '" target="_blank" rel="noopener">ニコニコで開く</a>' +
        '</div>' +
        '<button class="clear-btn" title="解除">×</button>';
      bindClear(cell, i);
      return;
    }

    // 通常のiframe（YouTube動画・Twitch・ニコニコ動画）
    if (data.embed) {
      cell.innerHTML =
        '<iframe src="' + data.embed + '" ' +
          'allow="autoplay; fullscreen; picture-in-picture; encrypted-media" ' +
          'allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>' +
        '<button class="clear-btn" title="解除">×</button>';
      bindClear(cell, i);
      return;
    }

    renderEmpty(cell, i);
  }

  function paint(i) {
    if (state[i]) renderFilled(cells[i], i);
    else          renderEmpty(cells[i], i);
  }

  // ---------- モーダル ----------
  function setHint(text, cls) {
    hint.textContent = text;
    hint.className = "hint" + (cls ? " " + cls : "");
  }

  function openModal(i) {
    activeIndex = i;
    pending = null;
    urlInput.value = "";
    embedInput.value = "";
    okBtn.disabled = true;
    setHint("", "");
    overlay.classList.add("open");
    setTimeout(() => urlInput.focus(), 50);
  }
  function closeModal() {
    overlay.classList.remove("open");
    activeIndex = null;
    pending = null;
  }

  urlInput.addEventListener("input", () => {
    embedInput.value = "";
    const r = parse(urlInput.value);
    if (r.error) {
      pending = null;
      okBtn.disabled = true;
      setHint(urlInput.value.trim() ? r.error : "", urlInput.value.trim() ? "err" : "");
    } else if (r.embed || r.channelId || r.nicoLiveId) {
      pending = r;
      okBtn.disabled = false;
      setHint("✓ " + r.platform + " を挿入します", "ok");
    } else {
      pending = null;
      okBtn.disabled = true;
      setHint("", "");
    }
  });

  embedInput.addEventListener("input", () => {
    const v = embedInput.value.trim();
    if (v) {
      urlInput.value = "";
      pending = { platform: "カスタム埋め込み", rawEmbed: v };
      okBtn.disabled = false;
      setHint("✓ 埋め込みタグを挿入します", "ok");
    } else {
      pending = null;
      okBtn.disabled = true;
      setHint("", "");
    }
  });

  function commit() {
    if (activeIndex === null || !pending) return;
    state[activeIndex] = pending;
    persist();
    paint(activeIndex);
    closeModal();
  }

  okBtn.addEventListener("click", commit);
  cancelBtn.addEventListener("click", closeModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && pending) commit(); });
  embedInput.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  // ---------- 起動 ----------
  restore();
  for (let i = 0; i < 4; i++) paint(i);
})();
</script>
</body>
</html>
